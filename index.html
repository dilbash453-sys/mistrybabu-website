<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MistryBabu.com — अपडेट 8 और 9</title>
<style>
  body{font-family:Arial,sans-serif;background:#f1f5f9;margin:0;padding:20px;color:#172033}
  .box{max-width:600px;margin:auto;background:#fff;padding:20px;border-radius:18px;box-shadow:0 4px 18px #0001}
  h2{margin-top:0}
  label{display:block;font-weight:bold;margin:15px 0 7px}
  textarea,input{width:100%;box-sizing:border-box;padding:12px;border:1px solid #cbd5e1;border-radius:10px;font-size:16px}
  .row{display:flex;gap:8px;align-items:center}
  .row textarea{flex:1}
  button{border:0;border-radius:10px;padding:12px 15px;font-weight:bold;cursor:pointer}
  #voiceBtn{background:#0f172a;color:#fff;white-space:nowrap}
  #gpsBtn{background:#f59e0b;color:#111827;width:100%;margin-top:10px}
  #postBtn{background:#2563eb;color:white;width:100%;margin-top:15px}
  .status{margin-top:10px;padding:10px;border-radius:10px;background:#f8fafc;font-size:14px}
  .note{font-size:13px;color:#64748b;margin-top:5px}
</style>
</head>
<body>
<div class="box">
  <h2>📍 काम पोस्ट करें</h2>

  <label for="jobText">काम का विवरण</label>
  <div class="row">
    <textarea id="jobText" rows="5" placeholder="काम बोलकर लिखें या टाइप करें..."></textarea>
    <button id="voiceBtn" type="button">🎙️ बोलकर लिखें</button>
  </div>
  <div class="note">🎙️ माइक्रोफोन बटन मोबाइल ब्राउज़र पर बोले हुए शब्दों को टेक्स्ट में लिखने के लिए है।</div>

  <label>📍 GPS लोकेशन</label>
  <input id="gpsLocation" type="text" readonly placeholder="काम पोस्ट करते समय लाइव लोकेशन कैप्चर होगी">
  <input id="gpsLat" type="hidden">
  <input id="gpsLng" type="hidden">
  <button id="gpsBtn" type="button">📍 लाइव GPS लोकेशन कैप्चर करें</button>
  <div id="gpsStatus" class="status">लोकेशन अभी कैप्चर नहीं हुई है।</div>

  <button id="postBtn" type="button">📨 काम पोस्ट करें</button>
</div>

<script>
let recognition = null;

/* अपडेट 9 — वॉइस स्पीच-टू-टेक्स्ट */
const voiceBtn = document.getElementById('voiceBtn');
const jobText = document.getElementById('jobText');

const SpeechRecognition =
  window.SpeechRecognition || window.webkitSpeechRecognition;

if (SpeechRecognition) {
  recognition = new SpeechRecognition();
  recognition.lang = 'hi-IN';
  recognition.interimResults = true;
  recognition.continuous = false;

  recognition.onstart = () => {
    voiceBtn.textContent = '⏹️ सुन रहा है...';
  };

  recognition.onresult = (event) => {
    let text = '';
    for (let i = event.resultIndex; i < event.results.length; i++) {
      text += event.results[i][0].transcript;
    }
    if (text.trim()) {
      jobText.value = (jobText.value ? jobText.value + ' ' : '') + text.trim();
    }
  };

  recognition.onerror = () => {
    voiceBtn.textContent = '🎙️ बोलकर लिखें';
  };

  recognition.onend = () => {
    voiceBtn.textContent = '🎙️ बोलकर लिखें';
  };

  voiceBtn.addEventListener('click', () => {
    try {
      recognition.start();
    } catch (e) {}
  });
} else {
  voiceBtn.addEventListener('click', () => {
    alert('इस मोबाइल ब्राउज़र में वॉइस-टू-टेक्स्ट उपलब्ध नहीं है। Chrome जैसे समर्थित ब्राउज़र में प्रयास करें।');
  });
}

/* अपडेट 8 — लाइव GPS लोकेशन कैप्चर */
const gpsBtn = document.getElementById('gpsBtn');
const gpsStatus = document.getElementById('gpsStatus');
const gpsLocation = document.getElementById('gpsLocation');
const gpsLat = document.getElementById('gpsLat');
const gpsLng = document.getElementById('gpsLng');

function captureGPS() {
  if (!navigator.geolocation) {
    gpsStatus.textContent = 'इस डिवाइस/ब्राउज़र में GPS उपलब्ध नहीं है।';
    return;
  }

  gpsStatus.textContent = '📍 लाइव GPS लोकेशन कैप्चर हो रही है...';

  navigator.geolocation.getCurrentPosition(
    (position) => {
      const lat = position.coords.latitude;
      const lng = position.coords.longitude;
      const accuracy = Math.round(position.coords.accuracy);

      gpsLat.value = lat;
      gpsLng.value = lng;
      gpsLocation.value = `${lat}, ${lng}`;

      gpsStatus.textContent =
        `✅ GPS लोकेशन कैप्चर हो गई। Accuracy लगभग ${accuracy} मीटर।`;
    },
    (error) => {
      gpsStatus.textContent =
        '⚠️ GPS लोकेशन नहीं मिल सकी। Location Permission चालू करके फिर प्रयास करें।';
    },
    {
      enableHighAccuracy: true,
      timeout: 15000,
      maximumAge: 0
    }
  );
}

gpsBtn.addEventListener('click', captureGPS);

/* काम पोस्ट करने से पहले GPS लेना अनिवार्य */
document.getElementById('postBtn').addEventListener('click', () => {
  if (!gpsLat.value || !gpsLng.value) {
    alert('काम पोस्ट करने से पहले लाइव GPS लोकेशन कैप्चर करें।');
    captureGPS();
    return;
  }

  alert('काम पोस्ट करने के लिए GPS लोकेशन फॉर्म में सेव है।');
});
</script>
</body>
</html>
